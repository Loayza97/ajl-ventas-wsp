<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Navigator Leads — AJL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2433;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#f85149;
  --orange:#ffa657;--yellow:#e3b341;--blue:#388bfd;--purple:#c9b1ff;
  --msg-bg:#0d2818;--msg-border:#1a4731;--msg-text:#7ee787;
  --lead-bg:#1d1135;--lead-border:#3d1f6e;--lead-text:#c9b1ff;
  --radius:12px;
}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;padding-bottom:68px;overflow-x:hidden}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:200;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px 8px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.app-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
.app-sub{font-size:11px;color:var(--muted)}
.btn-reset{background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:11px;padding:4px 10px;cursor:pointer;font-family:inherit;font-weight:600}
.btn-reset:active{background:var(--card2);color:var(--text)}
.search-wrap{position:relative}
.search-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 32px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.search-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-weight:600;display:none}

/* BREADCRUMB */
.breadcrumb{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--border);min-height:38px;align-items:center}
.breadcrumb::-webkit-scrollbar{display:none}
.bc-item{flex-shrink:0;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;background:var(--card2);border:1px solid var(--border);cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);transition:all .15s}
.bc-item:active{background:var(--card)}
.bc-item.current{color:var(--text);border-color:var(--green);background:var(--card)}
.bc-arrow{color:var(--border);font-size:11px;flex-shrink:0}
.bc-empty{font-size:12px;color:var(--muted);font-style:italic}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 4px 9px;background:none;border:none;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;min-height:52px;font-family:inherit;transition:color .15s}
.nav-btn .ni{font-size:20px;line-height:1}
.nav-btn.active{color:var(--green)}

/* TABS */
.tab{display:none}.tab.active{display:block}

/* CONTAINER */
.c{max-width:640px;margin:0 auto;padding:14px 12px}

/* PHASE BADGE */
.pb{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:.3px}

/* NODE CARD */
.node-header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.node-title{font-size:17px;font-weight:800}
.node-sub{font-size:12px;color:var(--muted);margin-bottom:14px}

/* MESSAGES */
.msg{background:var(--msg-bg);border:1px solid var(--msg-border);border-radius:10px;padding:11px 13px;margin:5px 0;font-size:14px;color:var(--msg-text);white-space:pre-wrap;cursor:pointer;position:relative;transition:border-color .15s}
.msg:active{border-color:#22c55e;background:#0d3520}
.msg.copied{border-color:#22c55e}
.mtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#4ade80;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.mcopy{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-size:10px}
.msg.copied .mcopy{color:#22c55e}

/* ACTION (send image) */
.action{background:#1a1400;border:2px dashed #713f12;border-radius:10px;padding:10px 13px;margin:5px 0;display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:600;color:#fde68a}

/* INFO / ALERT */
.info{background:#060f1f;border:1px solid #1e3a5f;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;color:#93c5fd;line-height:1.5}
.alert-box{background:#1a0505;border:1px solid #7f1d1d;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;color:#fca5a5;line-height:1.5}
.alert-box strong{color:var(--red)}

/* LEAD SAY */
.lsay{background:var(--lead-bg);border:1px solid var(--lead-border);border-radius:10px;padding:8px 13px;margin:5px 0;font-size:13px;color:var(--lead-text);font-style:italic}
.lsay::before{content:'Lead: ';font-weight:700;font-style:normal;color:#a78bfa}

/* SECTION DIVIDER */
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.opt{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:10px;line-height:1.4}
.opt:active{border-color:var(--green);background:#0d2818;color:var(--green)}
.opt .oi{font-size:18px;flex-shrink:0}
.opt-alert{border-color:#5c1a1a;color:#fca5a5}
.opt-alert:active{border-color:var(--red);background:#1a0505}

/* NEXT STEP */
.next-arrow{font-size:13px;color:var(--blue);font-weight:600;padding:10px 12px;background:#030d1a;border-radius:8px;display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.next-arrow:active{background:#061a30}

/* BRANCH */
.branch-label{font-size:11px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
.branch-content{padding:6px 0 6px 12px;border-left:3px solid var(--orange);margin-bottom:8px}

/* SEARCH RESULTS */
.sr-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.sr-item:active{border-color:var(--green)}
.sr-lead{font-size:13px;color:var(--lead-text);font-weight:600;margin-bottom:4px}
.sr-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sr-cat{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;background:var(--card2)}

/* ACCORDION (Objections/Resources tabs) */
.acc-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:none;border:none;width:100%;text-align:left;color:var(--text);font-family:inherit}
.acc-head:active{background:var(--card2)}
.acc-num{width:32px;height:32px;border-radius:7px;background:#1e0808;border:1px solid #5c1a1a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--red);flex-shrink:0}
.acc-title{font-size:13px;font-weight:600;flex:1}
.acc-cat{font-size:10px;color:var(--muted);padding:2px 7px;border-radius:4px;background:var(--card2);font-weight:600}
.acc-chevron{font-size:16px;color:var(--muted);transition:transform .2s}
.acc-item.open .acc-chevron{transform:rotate(90deg)}
.acc-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.acc-item.open .acc-body{display:block}

/* RESOURCES */
.res-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.res-title{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.plan-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.plan-name{font-size:13px;font-weight:700;margin-bottom:2px}
.plan-price{font-size:18px;font-weight:800;color:var(--green)}
.plan-freq{font-size:11px;color:var(--muted)}
.rule-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
.rule-item:last-child{border-bottom:none}
.rule-num{color:var(--orange);font-weight:800;margin-right:6px}

/* END STATE */
.end-card{background:#0d2818;border:2px solid #1a4731;border-radius:var(--radius);padding:20px;text-align:center;margin:20px 0}
.end-icon{font-size:40px;margin-bottom:8px}
.end-title{font-size:16px;font-weight:700;color:var(--green);margin-bottom:4px}
.end-sub{font-size:13px;color:var(--muted)}

/* TOAST */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#22c55e;color:#000;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:all .25s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease}

/* RESPONSIVE */
@media(min-width:481px){.c{max-width:640px;padding:14px 16px}}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-row">
    <span class="app-title"><span class="dot"></span>Navigator Leads <span class="app-sub">v4 · AJL</span></span>
    <button class="btn-reset" onclick="resetConversation()">Nueva conv.</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input class="search-input" id="searchInput" placeholder="Buscar (ej: caro, alcohol, tiempo...)" oninput="onSearch(this.value)">
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<!-- BREADCRUMB -->
<div class="breadcrumb" id="breadcrumb"><span class="bc-empty">Nueva conversación</span></div>

<!-- MAIN CONTENT -->
<div class="tab active" id="tab-wizard"><div class="c" id="wizardContent"></div></div>
<div class="tab" id="tab-obj"><div class="c" id="objContent"></div></div>
<div class="tab" id="tab-res"><div class="c" id="resContent"></div></div>
<div class="tab" id="tab-search"><div class="c" id="searchContent"></div></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="navWizard" onclick="showTab('wizard')"><span class="ni">&#129517;</span>Guía</button>
  <button class="nav-btn" id="navObj" onclick="showTab('obj')"><span class="ni">&#128737;</span>Objeciones</button>
  <button class="nav-btn" id="navRes" onclick="showTab('res')"><span class="ni">&#128218;</span>Recursos</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Copiado</div>

<script>
// ============================================================
// PHASE COLORS
// ============================================================
const PC = {
  F1:'#6366f1', 'F1c':'#818cf8', F4:'#f97316', F3:'#ec4899',
  F5:'#eab308', F6:'#14b8a6', F7:'#3b82f6', F8:'#10b981',
  F9:'#ef4444', F10:'#f59e0b', REC:'#8b5cf6', ESC:'#f85149'
};

// ============================================================
// MESSAGE STORE (avoids escaping issues in HTML)
// ============================================================
const M = [];
function m(text) { M.push(text); return M.length - 1; }

// ============================================================
// NODES — Conversation State Machine
// ============================================================
const NODES = {

// ---- F1: BIENVENIDA ----
'start': {
  phase:'F1', title:'Bienvenida', sub:'Enviar saludo universal al lead',
  send:[{tag:'Mensaje universal', mid: m(`Hola! Te damos la bienvenida a AJL Nutrición. Aquí ayudamos a personas que quieren comer mejor sin dejar de vivir su vida, sin prohibiciones.\n\nCuéntame, cuál es tu nombre y qué quisieras mejorar en tu alimentación?`)}],
  info:'Un solo mensaje universal. No hay variantes por fuente (IG, TikTok, referido).',
  prompt:'Qué responde el lead?',
  options:[
    {label:'"Hola" / saludo genérico', icon:'👋', next:'f1-greeting'},
    {label:'Solo nombre ("Maria")', icon:'👤', next:'f1-name-only'},
    {label:'Nombre + objetivo corto', icon:'📝', next:'f1c-age'},
    {label:'Nombre + objetivo + emoción (respuesta rica)', icon:'💬', next:'f1c-age'},
    {label:'"Quiero información" / "Qué servicios?"', icon:'ℹ️', next:'f1-info'},
    {label:'"Cuanto cuesta?" / "Precios"', icon:'💰', next:'f1-price'},
    {label:'Nombre + "quiero información"', icon:'📋', next:'f1-name-info'},
    {label:'No responde (2h)', icon:'⏰', next:'f1-nudge'},
  ]
},

'f1-greeting': {
  phase:'F1', title:'Lead saluda', sub:'Solo dijo "Hola" — reenviar bienvenida',
  send:[{tag:'Reenviar bienvenida', mid: m(`Hola! Te damos la bienvenida a AJL. Cuál es tu nombre y qué quisieras mejorar en tu alimentación?`)}],
  prompt:'Qué responde?',
  options:[
    {label:'Nombre + objetivo', icon:'📝', next:'f1c-age'},
    {label:'Solo nombre', icon:'👤', next:'f1-name-only'},
    {label:'Pide info / precios', icon:'💰', next:'f1-info'},
    {label:'No responde (2h)', icon:'⏰', next:'f1-nudge'},
  ]
},

'f1-name-only': {
  phase:'F1', title:'Solo dijo su nombre', sub:'Repreguntar objetivo',
  send:[{tag:'Preguntar objetivo', mid: m(`[NOMBRE]! Qué quisieras mejorar en tu alimentación?`)}],
  info:'Reemplazar [NOMBRE] con el nombre real del lead.',
  prompt:'Qué responde?',
  options:[
    {label:'Nombre + objetivo corto', icon:'📝', next:'f1c-age'},
    {label:'Nombre + objetivo + emoción', icon:'💬', next:'f1c-age'},
    {label:'No responde (2h)', icon:'⏰', next:'f1-nudge'},
  ]
},

'f1-info': {
  phase:'F1', title:'Pide información', sub:'Mini-pitch + 3 opciones cerradas',
  send:[{tag:'Mini-pitch + opciones', mid: m(`Claro! Hacemos asesorías nutricionales personalizadas a tu vida, sin dietas genéricas ni prohibiciones. Para orientarte bien, cuál es tu nombre y qué estás buscando: bajar de peso, ganar masa, o mejorar algún tema de salud?`)}],
  prompt:'Qué responde?',
  options:[
    {label:'Da nombre + objetivo', icon:'📝', next:'f1c-age'},
    {label:'Insiste en precios', icon:'💰', next:'f1-price'},
    {label:'No responde', icon:'⏰', next:'f1-nudge'},
  ]
},

'f1-price': {
  phase:'F1', title:'Pregunta precios (1ra vez)', sub:'Redirigir a escucha sin dar números',
  send:[{tag:'Redirigir sin precio', mid: m(`Claro, tenemos diferentes opciones según el nivel de acompañamiento. Para recomendarte la alternativa ideal para ti, cuál es tu nombre y qué estás buscando: bajar de peso, ganar masa, o mejorar algún tema de salud?`)}],
  info:'No dar rango numérico. Evitar price anchoring sin value framing.',
  prompt:'Qué responde?',
  options:[
    {label:'Da nombre + objetivo', icon:'📝', next:'f1c-age'},
    {label:'Insiste en precios (2da vez)', icon:'💰', next:'f1-price-fast'},
    {label:'No responde', icon:'⏰', next:'f1-nudge'},
  ]
},

'f1-price-fast': {
  phase:'F1', title:'Insiste en precios (2da vez)', sub:'Fast track: pitch comprimido → precios',
  send:[{tag:'Aceptar + transición', mid: m(`Y claro, te muestro las opciones. Déjame explicarte rápido qué incluye cada una para que puedas elegir bien.`)}],
  info:'Fast track: saltar a F7 comprimido (1-2 msgs) → F8 directo.',
  prompt:'Siguiente paso:',
  options:[
    {label:'Ir a Pitch comprimido → Planes', icon:'⚡', next:'f7-pitch'},
  ]
},

'f1-name-info': {
  phase:'F1', title:'Nombre + pide info', sub:'Mini-pitch personalizado',
  send:[{tag:'Mini-pitch con nombre', mid: m(`[NOMBRE]! Hacemos asesorías nutricionales personalizadas a tu vida, sin prohibiciones. Qué estás buscando: bajar de peso, ganar masa, o mejorar algún tema de salud?`)}],
  prompt:'Qué responde?',
  options:[
    {label:'Elige opción / da objetivo', icon:'📝', next:'f1c-age'},
    {label:'No responde', icon:'⏰', next:'f1-nudge'},
  ]
},

'f1-nudge': {
  phase:'F1', title:'No responde (2h)', sub:'Enviar nudge suave',
  send:[{tag:'Nudge 2h', mid: m(`Hola! Quedó pendiente tu mensaje. Estoy por aquí cuando puedas contarme.`)}],
  prompt:'Qué pasa?',
  options:[
    {label:'Responde', icon:'✅', next:'start'},
    {label:'No responde (24h)', icon:'⏰', next:'rec-t1'},
  ]
},

// ---- F1c: EDAD ----
'f1c-age': {
  phase:'F1c', title:'Preguntar edad', sub:'Filtrar menores antes de invertir en conversación',
  send:[{tag:'Preguntar edad', mid: m(`Genial [NOMBRE]! Cuántos años tienes?`)}],
  info:'Reemplazar [NOMBRE]. La edad filtra menores antes de profundizar.',
  prompt:'Qué edad tiene?',
  options:[
    {label:'18 años o más', icon:'✅', next:'f4-ask'},
    {label:'Menor de 18', icon:'🚫', next:'f1c-minor'},
  ]
},

'f1c-minor': {
  phase:'F1c', title:'Menor de edad', sub:'Corte inmediato — no atendemos menores',
  send:[{tag:'Mensaje de corte', mid: m(`Gracias por escribirnos. Para atenderte necesitamos que un papá, mamá o apoderado se comunique con nosotros. Que se ponga en contacto por aquí y con gusto lo atendemos.`)}],
  end:true, endType:'cut', endMsg:'Conversacion finalizada (menor de edad)'
},

// ---- F4: HISTORIA (antes de F3) ----
'f4-ask': {
  phase:'F4', title:'Extraer historia', sub:'Conocer intentos previos del lead',
  send:[{tag:'Pregunta principal', mid: m(`[NOMBRE], has intentado algo antes o es la primera vez que buscas ayuda?`)}],
  info:'Si el lead YA mencionó intentos en F1 (respuesta rica), NO repetir esta pregunta. Usar Branch A.',
  prompt:'Qué responde?',
  options:[
    {label:'"Si, ya intente con nutricionista / dietas..."', icon:'🔄', next:'f4-tried'},
    {label:'"No, es la primera vez"', icon:'🆕', next:'f4-first'},
    {label:'Ya mencionó intentos en F1 (Branch A)', icon:'📖', next:'f4-branch-a'},
    {label:'No responde', icon:'⏰', next:'rec-t1'},
  ]
},

'f4-branch-a': {
  phase:'F4', title:'Branch A: ya mencionó en F1', sub:'Usar contexto previo — NO repetir pregunta',
  send:[{tag:'Conectar con contexto', mid: m(`[NOMBRE], me cuentas que ya intentaste [REFERENCIA]. Y qué sientes que no funcionó en esas experiencias?`)}],
  info:'Reemplazar [REFERENCIA] con lo que dijo en F1. Ej: "dietas", "otro nutricionista", etc.',
  prompt:'Qué responde?',
  options:[
    {label:'Comparte su experiencia', icon:'💬', next:'f4-normalize'},
    {label:'Respuesta mínima', icon:'📝', next:'f4-normalize'},
  ]
},

'f4-tried': {
  phase:'F4', title:'Ya intentó antes', sub:'Profundizar en qué falló',
  send:[{tag:'Follow-up', mid: m(`Y qué sientes que no funcionó en esas experiencias?`)}],
  prompt:'Lead cuenta su experiencia. Siguiente:',
  options:[
    {label:'Normalizar experiencia', icon:'➡️', next:'f4-normalize'},
  ]
},

'f4-normalize': {
  phase:'F4', title:'Normalizar', sub:'Validar sin externalizar culpa',
  send:[{tag:'Normalización', mid: m(`Es súper común lo que me cuentas. La mayoría de personas que nos escriben tienen experiencias parecidas.`)}],
  alert:'NO usar: "Eso habla bien de ti" (moral), "me alegra que hayas dado este paso" (moral), "los otros métodos no funcionaban" (externalizar culpa).',
  prompt:'Siguiente paso: empatizar',
  options:[
    {label:'Ir a Empatia', icon:'➡️', next:'f3-empathy'},
  ]
},

'f4-first': {
  phase:'F4', title:'Primera vez', sub:'Celebrar y preguntar motivación',
  send:[{tag:'Primera vez', mid: m(`Genial, buen momento para empezar con el pie derecho. Y qué te motivó a buscar ayuda ahora?`)}],
  prompt:'Lead cuenta su motivación. Siguiente:',
  options:[
    {label:'Ir a Empatia', icon:'➡️', next:'f3-empathy'},
  ]
},

// ---- F3: EMPATIA (después de F4) ----
'f3-empathy': {
  phase:'F3', title:'Empatia', sub:'Seleccionar variante según el estado emocional del lead',
  prompt:'Cómo se siente el lead?',

let state = { node:'start', history:[] };

function saveState() {
  try { localStorage.setItem('nav-leads-state', JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const s = localStorage.getItem('nav-leads-state');
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

function resetConversation() {
  state = { node:'start', history:[] };
  saveState();
  renderWizard();
  renderBreadcrumb();
  showTab('wizard');
}

// ============================================================
// RENDER: WIZARD
// ============================================================
function renderWizard() {
  const node = NODES[state.node];
  if (!node) return;
  const el = document.getElementById('wizardContent');
  let html = '<div class="fade-in">';

  // Phase badge + title
  const pc = PC[node.phase] || '#888';
  html += `<div class="node-header"><span class="pb" style="background:${pc}">${node.phase}</span><span class="node-title">${node.title}</span></div>`;
  if (node.sub) html += `<div class="node-sub">${node.sub}</div>`;

  // Alert box
  if (node.alert) html += `<div class="alert-box"><strong>ALERTA:</strong> ${node.alert}</div>`;

  // Messages to send
  if (node.send && node.send.length) {
    html += '<div class="sec">Envia</div>';
    node.send.forEach((msg, i) => {
      if (msg.tag) html += `<div class="mtag">${msg.tag}<span class="mcopy">toca para copiar</span></div>`;
      html += `<div class="msg" onclick="copyMsg(this,${msg.mid})">${esc(M[msg.mid])}</div>`;
    });
  }

  // Action (send image)
  if (node.action) html += `<div class="action"><span style="font-size:20px">&#128248;</span>${node.action}</div>`;

  // Branches
  if (node.branches) {
    node.branches.forEach(br => {
      html += `<div class="branch-label">${br.label}</div><div class="branch-content">`;
      br.steps.forEach(s => {
        if (s.tag) html += `<div class="mtag">${s.tag}<span class="mcopy">toca para copiar</span></div>`;
        html += `<div class="msg" onclick="copyMsg(this,${s.mid})">${esc(M[s.mid])}</div>`;
      });
      html += '</div>';
    });
  }

  // Info box
  if (node.info) html += `<div class="info">${node.info}</div>`;

  // End state
  if (node.end) {
    const icons = {success:'&#127881;', cut:'&#128683;', archive:'&#128230;', escalate:'&#128680;'};
    const colors = {success:'#3fb950', cut:'#f85149', archive:'#8b949e', escalate:'#f85149'};
    html += `<div class="end-card"><div class="end-icon">${icons[node.endType]||'&#9989;'}</div><div class="end-title" style="color:${colors[node.endType]||'#3fb950'}">${node.endMsg}</div><div class="end-sub">Toca "Nueva conv." para empezar otra</div></div>`;
  }

  // Options
  if (node.options && node.options.length) {
    html += `<div class="sec">${node.prompt || 'Siguiente'}</div><div class="options">`;
    node.options.forEach(opt => {
      const cls = opt.cls ? ' ' + opt.cls : '';
      html += `<button class="opt${cls}" onclick="pickOption('${opt.next}','${esc(opt.label)}')">${opt.icon ? '<span class="oi">'+opt.icon+'</span>' : ''}${opt.label}</button>`;
    });
    html += '</div>';
  }

  html += '</div>';
  el.innerHTML = html;
  el.scrollTop = 0;
  window.scrollTo({top: document.querySelector('.breadcrumb').offsetTop + 40, behavior:'smooth'});
}

function pickOption(nextNode, label) {
  state.history.push({ node: state.node, label: label });
  state.node = nextNode;
  saveState();
  renderWizard();
  renderBreadcrumb();
}

function goBack(idx) {
  if (idx < 0) {
    state = { node:'start', history:[] };
  } else {
    const target = state.history[idx];
    state.history = state.history.slice(0, idx);
    state.node = target.node;
  }
  saveState();
  renderWizard();
  renderBreadcrumb();
}

// ============================================================
// RENDER: BREADCRUMB
// ============================================================
function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  if (!state.history.length && state.node === 'start') {
    el.innerHTML = '<span class="bc-empty">Nueva conversación</span>';
    return;
  }
  let html = '';
  // Start
  html += `<button class="bc-item" onclick="goBack(-1)">Inicio</button>`;
  // History items
  state.history.forEach((h, i) => {
    const n = NODES[h.node];
    const pc = PC[n?.phase] || '#888';
    html += `<span class="bc-arrow">&#9656;</span>`;
    html += `<button class="bc-item" onclick="goBack(${i})" style="border-color:${pc}">${n?.phase || '?'}</button>`;
  });
  // Current
  const cur = NODES[state.node];
  if (cur) {
    const pc = PC[cur.phase] || '#888';
    html += `<span class="bc-arrow">&#9656;</span>`;
    html += `<span class="bc-item current" style="border-color:${pc};color:${pc}">${cur.phase} ${cur.title.substring(0,12)}</span>`;
  }
  el.innerHTML = html;
  // Scroll to end
  el.scrollLeft = el.scrollWidth;
}

// SEARCH
// ============================================================
function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[?¿!¡"']/g, '');
}

function onSearch(query) {
  const q = query.trim();
  const countEl = document.getElementById('searchCount');
  if (!q || q.length < 2) {
    countEl.style.display = 'none';
    showTab(currentTab === 'search' ? 'wizard' : currentTab);
    return;
  }
  const terms = normalize(q).split(/\s+/);
  const results = [];

  // Search nodes
  Object.entries(NODES).forEach(([id, node]) => {
    let score = 0;
    const titleNorm = normalize(node.title + ' ' + (node.sub || ''));
    const msgsNorm = normalize((node.send || []).map(s => M[s.mid]).join(' '));
    for (const t of terms) {
      if (titleNorm.includes(t)) score += 10;
      if (msgsNorm.includes(t)) score += 3;
    }
    if (terms.every(t => (titleNorm + ' ' + msgsNorm).includes(t))) score += 5;
    if (score > 0) results.push({ type:'node', id, node, score });
  });

  // Search objections
  OBJS.forEach(o => {
    let score = 0;
    const qNorm = normalize(o.q + ' ' + o.cat);
    const rNorm = normalize(M[o.r]);
    for (const t of terms) {
      if (qNorm.includes(t)) score += 10;
      if (rNorm.includes(t)) score += 3;
    }
    if (terms.every(t => (qNorm + ' ' + rNorm).includes(t))) score += 5;
    if (score > 0) results.push({ type:'obj', obj:o, score });
  });

  results.sort((a, b) => b.score - a.score);

  // Render
  const el = document.getElementById('searchContent');
  countEl.textContent = results.length + ' result.';
  countEl.style.display = 'inline';

  if (!results.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Sin resultados</div>';
  } else {
    let html = '';
    results.slice(0, 20).forEach(r => {
      if (r.type === 'node') {
        const n = r.node;
        const pc = PC[n.phase] || '#888';
        html += `<div class="sr-item" onclick="jumpToNode('${r.id}')">`;
        html += `<div class="sr-lead">${n.title}</div>`;
        html += `<div class="sr-meta"><span class="pb" style="background:${pc};font-size:9px;padding:2px 6px">${n.phase}</span><span>${n.sub || ''}</span></div>`;
        html += `</div>`;
      } else {
        const o = r.obj;
        html += `<div class="sr-item" onclick="jumpToObj(${o.n})">`;
        html += `<div class="sr-lead">O${o.n}: ${o.q}</div>`;
        html += `<div class="sr-meta"><span class="pb" style="background:#ef4444;font-size:9px;padding:2px 6px">F9</span><span class="sr-cat">${o.cat}</span></div>`;
        html += `</div>`;
      }
    });
    el.innerHTML = html;
  }
  showTab('search');
}

function jumpToNode(id) {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchCount').style.display = 'none';
  state.history.push({ node: state.node, label: 'busqueda' });
  state.node = id;
  saveState();
  showTab('wizard');
  renderWizard();
  renderBreadcrumb();
}

function jumpToObj(n) {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchCount').style.display = 'none';
  showTab('obj');
  setTimeout(() => {
    const el = document.getElementById('acc-obj-' + n);
    if (el) { el.classList.add('open'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
  }, 100);
}

// ============================================================
// TABS
// ============================================================
let currentTab = 'wizard';

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navMap = {wizard:'navWizard', obj:'navObj', res:'navRes', search:'navWizard'};
  const navEl = document.getElementById(navMap[tab]);
  if (navEl) navEl.classList.add('active');
  // Show/hide breadcrumb
  document.getElementById('breadcrumb').style.display = (tab === 'wizard' || tab === 'search') ? 'flex' : 'none';
}

// ============================================================
// COPY + TOAST
// ============================================================
function copyMsg(el, mid) {
  const text = M[mid];
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); el.classList.remove('copied'); }, 1500);
  });
}

// ============================================================
// UTILS
// ============================================================
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// INIT
// ============================================================
loadState();
renderWizard();
renderBreadcrumb();
renderObjTab();
renderResTab();
</script>
</body>
</html>
