<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujo Comercial WSP — AJL Nutricion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}

  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:rgba(15,23,42,.95);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:10px 20px;display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h1{font-size:16px;font-weight:700}
  .topbar .sub{font-size:12px;color:#64748b}
  .back-link{
    color:#94a3b8;text-decoration:none;font-size:13px;
    padding:6px 12px;border-radius:6px;
    background:rgba(255,255,255,.06);transition:all .15s;
  }
  .back-link:hover{background:rgba(255,255,255,.12);color:#fff}

  .controls{
    position:fixed;bottom:20px;right:20px;z-index:100;
    display:flex;flex-direction:column;gap:6px;
  }
  .ctrl-btn{
    width:44px;height:44px;border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(15,23,42,.9);backdrop-filter:blur(8px);
    color:#fff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .ctrl-btn:hover{background:rgba(255,255,255,.15)}

  .legend{
    position:fixed;bottom:20px;left:20px;z-index:100;
    background:rgba(15,23,42,.92);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;padding:14px 18px;font-size:12px;
  }
  .legend-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin-bottom:8px}
  .legend-items{display:flex;flex-wrap:wrap;gap:8px 16px}
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}

  .hint{
    position:fixed;top:60px;left:50%;transform:translateX(-50%);
    background:rgba(99,102,241,.9);color:#fff;padding:8px 16px;
    border-radius:8px;font-size:12px;opacity:1;transition:opacity 1s;
    z-index:101;white-space:nowrap;
  }
  .hint.hidden{opacity:0;pointer-events:none}

  /* Viewport container */
  #viewport{
    position:fixed;
    top:50px;left:0;right:0;bottom:0;
    overflow:hidden;
    cursor:grab;
  }
  #viewport.dragging{cursor:grabbing}

  /* Canvas that transforms */
  #canvas{
    position:absolute;
    top:0;left:0;
    transform-origin:0 0;
    transition:transform .2s ease-out;
  }

  /* SVG layer for arrows */
  #arrows{
    position:absolute;
    top:0;left:0;
    pointer-events:none;
    overflow:visible;
  }

  /* Node styles */
  .node{
    position:absolute;
    padding:12px 16px;
    border-radius:8px;
    border:2px solid;
    font-size:13px;
    font-weight:600;
    text-align:center;
    line-height:1.3;
    white-space:nowrap;
    cursor:default;
    user-select:none;
  }

  /* Diamond decision nodes */
  .node.diamond{
    width:90px;
    height:90px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(45deg);
    border-radius:6px;
    font-size:11px;
    line-height:1.2;
  }
  .node.diamond .inner{
    transform:rotate(-45deg);
    max-width:70px;
    white-space:normal;
  }

  /* Group colors */
  .node.start{background:#1e293b;border-color:#475569;color:#f1f5f9;font-weight:700;border-width:3px}
  .node.trust{background:#dbeafe;border-color:#3b82f6;color:#1e3a5f}
  .node.data{background:#ede9fe;border-color:#8b5cf6;color:#3b0764}
  .node.pitch{background:#fef3c7;border-color:#f59e0b;color:#78350f}
  .node.price{background:#ffedd5;border-color:#f97316;color:#7c2d12}
  .node.objection{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}
  .node.close{background:#d1fae5;border-color:#10b981;color:#064e3b}
  .node.recovery{background:#e0e7ff;border-color:#6366f1;color:#312e81}
  .node.alert{background:#fca5a5;border-color:#dc2626;color:#7f1d1d;font-weight:700;border-width:3px}
  .node.decision{background:#fef9c3;border-color:#eab308;color:#713f12}
  .node.end{background:#065f46;border-color:#10b981;color:#d1fae5;border-width:3px;font-weight:800;font-size:14px}
  .node.archive{background:#374151;border-color:#6b7280;color:#d1d5db}

  @media(max-width:768px){
    .legend{display:none}
    .topbar{padding:8px 12px}
    .topbar h1{font-size:14px}
  }
</style>

// ══════════════════════════════════════════════════════
// RENDER NODES
// ══════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const nodeMap = {};

nodes.forEach(n => {
  const div = document.createElement('div');
  div.className = 'node ' + n.cls;
  div.id = n.id;

  if (n.cls.includes('diamond')) {
    div.innerHTML = `<div class="inner">${n.label}</div>`;
    div.style.left = (n.x - 45) + 'px';
    div.style.top = (n.y - 45) + 'px';
  } else {
    div.innerHTML = n.label;
    div.style.left = n.x + 'px';
    div.style.top = n.y + 'px';
  }

  canvas.appendChild(div);
  nodeMap[n.id] = {el: div, x: n.x, y: n.y, isDiamond: n.cls.includes('diamond')};
});

// ══════════════════════════════════════════════════════
// RENDER ARROWS
// ══════════════════════════════════════════════════════

const svg = document.getElementById('arrows');

function getCenter(id) {
  const n = nodeMap[id];
  const rect = n.el.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();

  if (n.isDiamond) {
    return {x: n.x, y: n.y};
  } else {
    return {
      x: n.x + rect.width / 2,
      y: n.y + rect.height / 2
    };
  }
}

edges.forEach(e => {
  const from = getCenter(e.from);
  const to = getCenter(e.to);

  // Simple straight arrow
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', from.x);
  line.setAttribute('y1', from.y);
  line.setAttribute('x2', to.x);
  line.setAttribute('y2', to.y);
  line.setAttribute('stroke', '#475569');
  line.setAttribute('stroke-width', '1.5');
  line.setAttribute('opacity', '0.75');
  line.setAttribute('marker-end', 'url(#arrowhead)');
  svg.appendChild(line);

  // Label
  if (e.label) {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const midX = (from.x + to.x) / 2;
    const midY = (from.y + to.y) / 2;
    text.setAttribute('x', midX);
    text.setAttribute('y', midY - 5);
    text.setAttribute('fill', '#cbd5e1');
    text.setAttribute('font-size', '10px');
    text.setAttribute('font-family', 'Inter, sans-serif');
    text.setAttribute('font-weight', '500');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'edge-label');
    text.textContent = e.label;

    // Background rect
    const bbox = text.getBBox();
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', bbox.x - 3);
    rect.setAttribute('y', bbox.y - 1);
    rect.setAttribute('width', bbox.width + 6);
    rect.setAttribute('height', bbox.height + 2);
    rect.setAttribute('fill', '#0f172a');
    rect.setAttribute('opacity', '0.85');
    rect.setAttribute('rx', '3');

    svg.insertBefore(rect, text);
  }
});

// Arrowhead marker
const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
marker.setAttribute('id', 'arrowhead');
marker.setAttribute('markerWidth', '10');
marker.setAttribute('markerHeight', '10');
marker.setAttribute('refX', '8');
marker.setAttribute('refY', '3');
marker.setAttribute('orient', 'auto');
const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
polygon.setAttribute('points', '0 0, 10 3, 0 6');
polygon.setAttribute('fill', '#475569');
marker.appendChild(polygon);
defs.appendChild(marker);
svg.insertBefore(defs, svg.firstChild);

// ══════════════════════════════════════════════════════
// PAN & ZOOM
// ══════════════════════════════════════════════════════

let scale = 1;
let translateX = 0;
let translateY = 0;
let isDragging = false;
let startX, startY;

function updateTransform() {
  canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

function resetView() {
  scale = 0.35;
  translateX = window.innerWidth / 2 - 3000 * scale / 2;
  translateY = window.innerHeight / 2 - 600 * scale / 2;
  updateTransform();
}

function zoomIn() {
  scale *= 1.25;
  if (scale > 3) scale = 3;
  updateTransform();
}

function zoomOut() {
  scale /= 1.25;
  if (scale < 0.08) scale = 0.08;
  updateTransform();
}

// Mouse pan
const viewport = document.getElementById('viewport');

viewport.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  viewport.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// Wheel zoom
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const oldScale = scale;
  scale *= delta;
  if (scale < 0.08) scale = 0.08;
  if (scale > 3) scale = 3;

  // Zoom to cursor position
  const rect = viewport.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
  translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

  updateTransform();
}, { passive: false });

// Touch support
let touchStartDist = 0;
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - translateX;
    startY = e.touches[0].clientY - translateY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.sqrt(dx * dx + dy * dy);
  }
});

viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    translateX = e.touches[0].clientX - startX;
    translateY = e.touches[0].clientY - startY;
    updateTransform();
  } else if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const delta = dist / touchStartDist;
    scale *= delta;
    if (scale < 0.08) scale = 0.08;
    if (scale > 3) scale = 3;
    touchStartDist = dist;
    updateTransform();
  }
}, { passive: false });

viewport.addEventListener('touchend', () => {
  isDragging = false;
  touchStartDist = 0;
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') zoomIn();
  if (e.key === '-') zoomOut();
  if (e.key === '0') resetView();
});

// Hide hint
setTimeout(() => document.getElementById('hint').classList.add('hidden'), 5000);

// Initial view
resetView();
</script>

</body>
</html>
